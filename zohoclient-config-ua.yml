---
## Second OpenCart shop (UA). Deployed as its own process (zohoclient-ua.service) with its own
## listen port, against its own OpenCart database, syncing into the same Zoho org.
##
## Its database is a copy of shop 1's, so the status ids, custom-field ids, order_total codes,
## shipping module codes and the carriage product all match shop 1 and are stated as such below.
## What genuinely differs is the currency (UAH only), the language id, and the fact that none of
## the optional subsystems run here.

env: ${LOG_ENV}
# Flip to true to run against the live shop without writing anything to Zoho, then restart the
# service. Deliberately not a deploy variable: it is a temporary switch, so it is edited here on the
# server and a deploy resets it to false.
dry_run: false
sql:
  enabled: true
  driver: ${SQL_DRIVER}
  hostname: ${SQL_HOSTNAME}
  username: ${SQL_USERNAME}
  password: ${SQL_PASSWORD}
  database: ${SQL_DATABASE}
  port: ${SQL_PORT}
  prefix: ${SQL_PREFIX}
mongo:
  enabled: true
  host: ${MONGO_HOST}
  port: ${MONGO_PORT}
  user: ${MONGO_USER}
  password: ${MONGO_PASSWORD}
  # MUST be a different database from shop 1's. Order versions are keyed by order_id alone
  # (mongo.go: filter {"order_id": …} in the "orders" collection), so two shops sharing one
  # database would append versions of unrelated orders to the same document.
  database: ${MONGO_DATABASE}
  expired_days: 90
telegram:
  enabled: true
  api_key: ${TELEGRAM_API_KEY}
  admin_id: ${TELEGRAM_ADMIN_ID}
  bot_name: Zoho Client UA
  min_log_level: debug
site:
  name: ${SITE_NAME}
  # Its own file: two instances appending to one log interleave their output and share rotation.
  log_file: zohoclient-ua.log
  timezone: Europe/Kyiv
  # NOT 2: this database has only language 1 (English) and 3 (Ukrainian). The product-description
  # joins are INNER joins, so a language id with no rows would silently return orders with zero
  # line items rather than failing outright.
  language_id: 3
  lookback_days: 30
  batch_limit: 10
  poll_interval: 120
  customer_poll_interval: 300
  nip_custom_field_id: "2"
  post_terminal_field: field29
  # Same catalogue as shop 1, so the same carriage pseudo-product — and the same Zoho product,
  # since both shops sync into one Zoho org.
  shipping_item_uid: 05ce91cd-5f7c-11ef-b7f6-00155d018000
  currencies: [UAH]
  order_statuses:
    # No payment-link statuses (22, 23): wfsync does not run against this shop.
    poll: [1, 2, 5, 17]
    new: 1
    canceled: 7
  # Empty: this shop runs no B2B flow, so no customer group is treated as B2B.
  b2b_group_ids: []
  customer_categories: {}
  total_codes:
    sub_total: sub_total
    shipping: shipping
    coupon: coupon
    tax: tax
    total: total
    discount: discount
  # None of the optional subsystems run here: no B2B pipeline, no customer sync, no SmartSender
  # (below), and payments are still off until the tranzzo flow is implemented. With these off the
  # service never creates or reads the zoho_payment_* or oc_customer.zoho_id columns.
  features:
    payments: true
    customer_sync: false
    b2b: false
  # wfsync does not run against this shop: its payments are processed inside OpenCart by Tranzzo.
  # The module writes the SAME wf_payment_* columns, but in its own vocabulary --
  # init | auth | capture | void -- so the source is what tells this service how to read them.
  # Reading them with the Stripe map would write every live payment into Zoho as "Помилка операції".
  # Flip features.payments to true once the oc_tranzzo_queue write-back lands.
  payments:
    source: tranzzo
  # Same shipping modules as shop 1 (copied database).
  shipping_code_map:
    filterit1.filterit0: inpost_courier
    filterit1.filterit1: inpost_terminal
    filterit0.filterit2: inpost
    filterit0.filterit0: dhl_courier
    filterit2.filterit0: dhl_courier
    filterit2.filterit1: dhl_courier
    dhl_country.dhl_country: dhl_courier
    pickup.pickup: pickup
zoho:
  client_id: ${ZOHO_CLIENT_ID}
  client_secret: ${ZOHO_CLIENT_SECRET}
  refresh_token: ${ZOHO_REFRESH_TOKEN}
  refresh_url: ${ZOHO_REFRESH_URL}
  crm_url: ${ZOHO_CRM_URL}
  scope: crm
  api_version: v8
  location: ${ZOHO_LOCATION}
  order_source: ${ZOHO_ORDER_SOURCE}
  terms: Standard terms apply.
  chunk_size: 200
  # Same Zoho org and the same Ukrainian picklist as shop 1.
  #
  # Read in BOTH directions and they are not symmetric. Outbound only the order_statuses.new entry
  # is ever used (buildZohoOrder always stamps it). Inbound, OrderStatusIdByName resolves an
  # arriving webhook status back to an OpenCart id by EXACT string match -- no trimming, no case
  # folding -- and answers -1 for anything unlisted, which the handler logs as "unknown status
  # name from Zoho, keeping current" and then does nothing. So every status a Zoho manager can set
  # needs an entry here, spelled exactly as the picklist spells it. Do not trim this map.
  # These two phrases are also the Tranzzo trigger statuses, and the OpenCart module matches them
  # as TEXT against its own admin setting -- they are NOT read from here. Neither matches the
  # module's built-in default (DEFAULT_STATUS_CAPTURE "Прийнятий, очікується оплата",
  # DEFAULT_STATUS_CANCEL "Отмена заказа"), so the module's capture/cancel lists must be set to
  # these exact values or ZohoStub::classify() returns ACTION_IGNORE and the event is only logged.
  # The module normalises before comparing (trim, collapse spaces, lowercase), so only the wording
  # has to agree, not the spacing.
  order_status_map:
    1: Нове
    # Polled (order_statuses.poll), so orders reach Zoho at this status; without a name here a
    # webhook carrying it back could not be resolved. Also the module's capture trigger.
    2: Опрацювання замовлення
    17: Оплачено, формування ТТН
    5: Перевірка та збір
    # site.order_statuses.canceled. Also the module's cancel trigger -- though an outbound
    # cancellation carries cancel:true as well, which overrides the text match entirely.
    7: Відмінено
    # INCOMPLETE. Any other status a manager can set in Zoho still needs a line here.
  post_types:
    inpost: InPost
    inpost_courier: InPost (кур'єр)
    inpost_terminal: InPost (поштомат)
    dhl_courier: DHL (кур'єр)
    pickup: Самовивіз
  # Same Payments picklist as shop 1 -- all seven values exist in this Zoho org. All seven must be
  # listed whatever the source: startup validation rejects a partial map, because a missing key
  # resolves to an empty string and Zoho would take the record with no Status at all.
  #
  # Only five are reachable from Tranzzo, whose whole vocabulary is four states
  # (PAY_STATE_* in catalog/model/extension/payment/tranzzo_multi.php):
  #
  #   init     -> created     -> Створено             link issued, no money yet. A FAILED attempt
  #                                                   files here too, so a failure reads as
  #                                                   "Створено" and never as "Помилка операції".
  #   auth     -> held        -> Кошти зарезервовано  funds authorised, awaiting capture.
  #   capture  -> paid        -> Оплачено             money moved. wf_payment_amount then carries
  #                                                   the CAPTURED sum, which can be less than the
  #                                                   sum the link was issued for.
  #   void     -> canceled    -> Скасовано            money returned. The module folds Tranzzo's
  #                                                   "void" and "refund" into this one state.
  #   (unknown)-> error       -> Помилка операції     only a string outside those four.
  #
  # Unreachable here, and kept only because validation needs the key:
  #   in_progress -> В процесі      Tranzzo has no such state; it is a Stripe distinction.
  #   refunded    -> Відшкодовано   a refund arrives as "void" and cannot be told from a released
  #                                 authorisation, so it lands on Скасовано. Reaching this value
  #                                 needs the module to distinguish the two transaction types.
  payment_statuses:
    created: Створено
    in_progress: В процесі
    held: Кошти зарезервовано
    paid: Оплачено
    canceled: Скасовано
    refunded: Відшкодовано
    error: Помилка операції
prod_repo:
  login: ${REPO_LOGIN}
  password: ${REPO_PASSWORD}
  prod_url: ${REPO_PROD_URL}
  # Sent as ?site=<code>. Without it the repository answers with the Polish shop's Zoho product
  # ids, which is what made Zoho reject the Sales Orders with FILTER_CRITERIA_NOT_SATISFIED.
  site_code: "${REPO_SITE_CODE}"
listen:
  bind_ip: 127.0.0.1
  # Every endpoint lives under this one path segment, health check included. Two instances
  # published on one domain need different values here so a proxy can route them by path.
  base_path: zoho
  port: ${LISTEN_PORT}
  key: ${API_KEY}
smartsender:
  enabled: false
